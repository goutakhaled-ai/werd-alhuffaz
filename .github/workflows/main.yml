name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          D=$(dirname "$(find . -maxdepth 3 -name settings.gradle | head -1)")
          cd "$D"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ward-alhuffaz.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ward-alhuffaz-apk
          path: ward-alhuffaz.apk
